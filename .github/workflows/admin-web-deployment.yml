name: Admin Web - Development

on:
  push:
    branches:
      - development
    paths:
      - "frontend/admin-web/**"
      - "docker/admin-web.dockerfile"
      - ".github/workflows/admin-web-deployment.yml"

  workflow_dispatch:

env:
  AZURE_REGISTRY: colegiolear.azurecr.io
  IMAGE_NAME: admin-web-colegio-lear
  IMAGE_TAG: development
  AZURE_RESOURCE_GROUP: admin-suite-colegio-lear-development
  AZURE_WEB_APP_NAME: app-development-admin-web-colegio-lear

jobs:
  build-push-and-deploy:
    name: Build, Push and Deploy Admin Web
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generar tag único basado en el commit
      - name: Set version tag
        run: |
          echo "VERSION_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 3. Login a Azure mediante OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Login a Azure Container Registry
      - name: Login to Azure Container Registry
        run: |
          az acr login --name colegiolear

      # 5. Build Docker image
      #
      # Se generan dos tags para la misma imagen:
      #
      # development -> siempre representa la última versión de development
      # VERSION_TAG -> identifica exactamente el commit que generó la imagen
      #
      - name: Build Docker image
        run: |
          docker build \
            -f docker/admin-web.dockerfile \
            --build-arg VITE_COLEGIO_LEAR_API_URL="${{ vars.VITE_COLEGIO_LEAR_API_URL }}" \
            --build-arg VITE_ENVIRONMENT="${{ vars.VITE_ENVIRONMENT }}" \
            -t ${{ env.AZURE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.AZURE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }} \
            .

      # 6. Push del tag development
      - name: Push development image
        run: |
          docker push \
            ${{ env.AZURE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 7. Push del tag de versión
      - name: Push version image
        run: |
          docker push \
            ${{ env.AZURE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}

            # 8. Reiniciar Azure Web App
      #
      # La Web App continúa configurada para utilizar:
      #
      # admin-web-colegio-lear:development
      #
      # El restart hace que Azure vuelva a obtener la imagen actualizada.
      #
      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --name "${{ env.AZURE_WEB_APP_NAME }}"
